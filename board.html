<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색동 한마당 · 전국 매트 현황판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/song-myung@5/korean-400.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1a3f">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="색동">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --ink: #1F2937; --ink-2: #374151; --muted: #6B7280; --faint: #9CA3AF;
    --line: #E5E7EB; --line-2: #EEF0F3; --coral: #F26A3D; --coral-dark: #DC5B31; --coral-tint: #FFF1EC;
    --gold: #F59E0B; --silver: #94A3B8; --bronze: #B45309;
    --red: #F2392F; --yellow: #FFD21F; --green: #2FC653; --blue: #4C88FF;
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px;
    --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.05);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); margin: 0; color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .container { max-width: 980px; margin: 0 auto; padding: 22px 16px 70px; }
  .mono { font-variant-numeric: tabular-nums; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { font-weight: 800; font-size: 1.05em; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 22px; height: 22px; }
  .logo i { border-radius: 3px; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-block; text-decoration: none; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.9em; }
  .btn:hover, .btn.on { border-color: var(--coral); color: var(--coral-dark); background: var(--coral-tint); }
  .hero { background: linear-gradient(135deg, #F2392F 0%, #FF8A3D 45%, #2FC653 120%); color: #fff; border-radius: var(--r-lg); padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .hero h1 { margin: 0 0 4px; font-size: 1.55em; }
  .hero p { margin: 0; opacity: .94; }
  .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .hero select { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 14px; color: var(--ink); background: #fff; }
  .hero-sels { display: flex; gap: 8px; flex-wrap: wrap; }
  /* 색동: 한지 바탕 + 색동 띠, 점퍼스와 같은 배치 (왼쪽 로고 · 가운데 글 · 오른쪽 고르기 · 아래 구호) */
  .sd-hero { position: relative; background: #F6EFE0; color: #2a2420; padding: 0; overflow: hidden; }
  .sd-hero::before { content: ""; position: absolute; inset: 0; opacity: .35; pointer-events: none; background-image: radial-gradient(rgba(120,90,50,.18) 1px, transparent 1.2px), radial-gradient(rgba(120,90,50,.12) 1px, transparent 1.4px); background-size: 7px 7px, 13px 11px; }
  .sd-band { position: relative; height: 12px; background: repeating-linear-gradient(90deg, #E0352B 0 40px, #F2C230 40px 80px, #2E9E57 80px 120px, #E77FA2 120px 160px, #2F5FB3 160px 200px, #FBF7EE 200px 240px, #7B3F86 240px 280px); }
  .hero-grid { position: relative; display: grid; grid-template-columns: 170px minmax(0,1fr) auto; align-items: center; gap: 18px; padding: 20px 24px 18px; }
  .hero-logo { grid-row: 1 / span 2; filter: drop-shadow(0 6px 14px rgba(60,40,20,.22)); }
  .hero-logo img { display: block; width: 100%; height: auto; }
  .hero-mid { text-align: center; }
  .sd-name { font-family: 'Song Myung', serif; font-size: 2.6em; line-height: 1.05; margin: 0 0 4px !important; opacity: 1 !important; color: #2a2420; }
  .sd-name small { font-family: 'Pretendard', sans-serif; font-size: .34em; font-weight: 700; color: #6b5a48; margin-left: 10px; vertical-align: middle; }
  .sd-slogan { font-family: 'Song Myung', serif; font-size: 1.32em; line-height: 1.3; word-break: keep-all; margin: 0 0 8px !important; opacity: 1 !important; color: #2a2420; }
  .sd-slogan .nw { white-space: nowrap; }
  .hero-slogan .nw { white-space: nowrap; font-style: normal; display: inline-block; }
  @media (max-width: 560px) { .hero-slogan > span { display: none; } .hero-slogan .nw { display: block; margin: 2px 0; } }
  .sd-name small { white-space: nowrap; }
  @media (max-width: 560px) { .sd-name small { display: block; margin: 8px 0 10px; font-size: .32em; } }
  .hero-mid #heroSub { font-size: 1.02em; line-height: 1.7; color: #5a4a3a; opacity: 1; }
  .hero-grid .hero-sels { flex-direction: column; align-items: flex-end; gap: 8px; }
  .hero-grid .hero-sels select { width: 200px; max-width: 100%; border: 1px solid #e3d6bf; }
  .hero-slogan { grid-column: 2 / -1; margin: 2px 0 0 !important; padding-top: 12px; border-top: 1px solid rgba(90,70,50,.25); text-align: center; font-size: .98em; font-weight: 700; color: #5a4a3a; opacity: 1 !important; white-space: nowrap; }
  .hero-slogan b { font-family: 'Song Myung', serif; font-weight: 400; font-size: 1.25em; color: #2a2420; margin-right: 2px; }
  .hero-slogan span { opacity: .6; margin: 0 .9em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 720px) {
    .hero-grid { grid-template-columns: 1fr; gap: 12px; }
    .hero-logo { grid-row: auto; max-width: 150px; margin: 0 auto; }
    .hero-grid .hero-sels { flex-direction: row; justify-content: center; flex-wrap: wrap; }
    .hero-grid .hero-sels select { width: auto; }
    .hero-slogan { grid-column: auto; white-space: normal; font-size: .9em; }
    .hero-slogan span { margin: 0 .4em; }
  }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi span { color: var(--muted); font-size: 0.82em; font-weight: 700; }
  .kpi b { display: block; font-size: 1.45em; }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.15em; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 0.86em; padding: 6px 12px; border-radius: 999px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--coral-dark); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { color: var(--muted); font-size: 0.85em; margin: 0 0 8px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 0.8em; font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); font-size: 0.93em; word-break: keep-all; }
  th.num, td.num { text-align: right; white-space: nowrap; }
  .rank { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; font-weight: 800; background: var(--bg); color: var(--ink-2); font-size: 0.9em; }
  .rank.r1 { background: var(--gold); color: #fff; } .rank.r2 { background: var(--silver); color: #fff; } .rank.r3 { background: var(--bronze); color: #fff; }
  .sub { color: var(--faint); font-size: 0.8em; margin-left: 4px; }
  .anon { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .err { background: #FEF3C7; color: #92400E; border-radius: var(--r-sm); padding: 12px 14px; font-weight: 700; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
  .foot { text-align: center; color: var(--faint); font-size: 0.8em; margin-top: 24px; }
  @media (max-width: 640px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hide-sm { display: none; }
    .hero h1 { font-size: 1.3em; }
    td, th { padding-left: 5px; padding-right: 5px; }
    td { font-size: 0.88em; }
    td.num .sub { display: block; margin-left: 0; }
  }
  .sd-tag{font-weight:600;color:#6b7280;font-size:.78em;display:inline-flex;align-items:baseline;gap:5px;margin-left:2px;white-space:nowrap}.sd-tag b{font-family:'Song Myung',serif;font-weight:400;font-size:1.3em;color:#2a2420}
  .sdi::before{content:'';display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-radius:3px;border:1.5px solid #0b1a3f;background:linear-gradient(#E0352B,#E0352B) 0 0/50% 50% no-repeat,linear-gradient(#F2C230,#F2C230) 100% 0/50% 50% no-repeat,linear-gradient(#2E9E57,#2E9E57) 0 100%/50% 50% no-repeat,linear-gradient(#2F5FB3,#2F5FB3) 100% 100%/50% 50% no-repeat}
  .brand .pg{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#1f2937}
  /* 넓은 화면(PC·노트북·가로 태블릿): 두 칸 — 왼쪽 로고·하늘까지·숫자, 오른쪽 순위들 */
  .fold-row, .more-row { text-align: center; }
  tr.gap td { text-align: center; color: var(--muted); padding: 0 !important; line-height: 1.2; letter-spacing: .2em; border-bottom: 0 !important; }
  tr.school.click { cursor: pointer; }
  tr.school.click:hover td { background: #FAFAFB; }
  tr.me td { background: var(--coral-tint) !important; }
  tr.detail td { background: #FAFAFB; padding: 4px 8px 14px; }
  table.mini th, table.mini td { padding: 6px 8px; font-size: .88em; }
  .tag-me { display: inline-block; background: var(--coral); color: #fff; font-size: 0.72em; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  @media (max-width: 640px) { .tag-me { display: block; width: fit-content; margin: 2px 0 0; } }
  .modal-bg { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
  .modal { background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 680px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 1.1em; }
  .modal-head .hint { display: block; font-weight: 500; margin: 2px 0 0; }
  .modal-x { border: 0; background: var(--line-2); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
  .modal-tabs { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
  .modal-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: .86em; cursor: pointer; color: var(--ink-2); }
  .modal-tabs button.on { background: var(--coral); border-color: var(--coral); color: #fff; }
  .modal-tabs .pop-search { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  .modal-tabs .pop-search:focus { outline: none; border-color: var(--coral); }
  .pop-pages { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .pop-empty { text-align: center; color: var(--ink-2); padding: 24px 0 8px; }
  .modal-body { overflow: auto; padding: 8px 18px 18px; }
  .more-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--coral-dark); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 700; font-size: .88em; cursor: pointer; }
  .more-btn:hover { border-color: var(--coral); background: var(--coral-tint); }
  @media (min-width: 1000px) {
    .container { max-width: 1560px; }
    .bw { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: auto 1fr; column-gap: 18px; align-items: start; }
    .bw > .hero { grid-column: 1; grid-row: 1; }
    .bw > #body { display: contents; }
    .bw-l { grid-column: 1; grid-row: 2; position: sticky; top: 16px; }
    .bw-r { grid-column: 2; grid-row: 1 / span 2; }
    .bw > #body > .loading, .bw > #body > .err { grid-column: 1 / -1; }
    .bw .hero-grid { grid-template-columns: 24% minmax(0,1fr); row-gap: 10px; padding: 16px 22px 14px; }
    .bw .hero-grid .hero-logo { grid-row: 1 / span 3; }
    .bw .hero-grid .hero-sels { grid-column: 2; justify-content: center; flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .bw .hero-grid .hero-sels select { width: auto; }
    .bw .hero-slogan { grid-column: 2; font-size: .9em; padding-top: 10px; }
    .bw .hero-slogan span { margin: 0 .45em; }
    .bw .sd-name { font-size: 2.2em; }
    .bw .hero-mid #heroSub { line-height: 1.5; }
    .bw .sd-slogan { font-size: 1.18em; }
  }
  @media (min-width: 1000px) and (max-width: 1279px) {
    .bw .hero-slogan { white-space: normal; line-height: 1.6; }
    .bw .hero-slogan > span { display: none; }
    .bw .hero-slogan .nw { margin: 0 .5em; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="brand" href="" title="새로 불러오기"><span id="sdMarkTop" style="line-height:0"></span><span class="pg">한마당</span><small class="sd-tag"><b>色童</b>색으로 노는 아이들</small></a>
    <nav class="nav">
      <a class="btn sdi" href="./">우리 학교</a>
      <a class="btn sdi" href="play/">놀이터</a>
      <a class="btn" href="#" id="cmQrBtn" data-target="board" onclick="return false">QR</a>
      <a class="btn" href="#" id="cmInstallBtn" onclick="return false">바로가기</a>
    </nav>
  </header>

  <div class="bw">
  <div class="hero sd-hero">
    <div class="sd-band"></div>
    <div class="hero-grid">
      <div class="hero-logo"><img src="img/saekdong-mark.webp" width="600" height="600" alt="색동"></div>
      <div class="hero-mid">
        <h1 class="sr-only">색동 한마당 · 전국 매트 현황판</h1>
        <p class="sd-name">색동 한마당<small>전국 매트 현황판</small></p>
        <p class="sd-slogan"><span class="nw">전국의 색동이 색으로 함께한</span> <span class="nw">놀이가 이곳에 모여요</span></p>
        <p id="heroSub">매달 1일에 새로 시작해요</p>
      </div>
      <div class="hero-sels">
        <select id="gameSel" aria-label="게임 고르기"></select>
        <select id="diffSel" aria-label="난이도 고르기"><option value="">모든 난이도</option></select>
        <select id="bandSel" aria-label="학년군 고르기"><option value="">전체 학년</option><option value="1-2">1~2학년</option><option value="3-4">3~4학년</option><option value="5-6">5~6학년</option></select>
        <select id="monthSel" aria-label="달 고르기"></select>
      </div>
      <p class="hero-slogan"><i class="nw"><b>色童</b> 색으로 노는 아이들</i><span>·</span><i class="nw"><b>色同</b> 색으로 함께</i><span>·</span><i class="nw"><b>色動</b> 색으로 움직여요</i></p>
    </div>
    <div class="sd-band"></div>
  </div>

  <div id="body"><div class="loading">현황판을 불러오는 중…</div></div>
  </div>
  <p class="foot">카메라가 판정하고 선생님이 확인한 기록만 모여요 · 학생 이름은 가려서 보여 줍니다 (예: 김*늘) · 학교 이름은 학교가 공개를 켠 경우에만 보여요<br>Made by <b>음악적체육인</b></p>
</div>

<script src="cm-app.js"></script>
<script>
(function(){
  const q = {}; new URLSearchParams(location.search).forEach(function(v, k){ q[k] = v; });
  const GAMES = (window.CMApp && CMApp.CAM_GAMES) || [['stroop','함정 뛰기',[['normal','노말'],['hard','하드'],['expert','익스퍼트']]]];
  const diffsOf = function(g){ const x = GAMES.find(function(r){ return r[0] === g; }); return x ? x[2] : []; };
  const fillDiff = function(v){ $('diffSel').innerHTML = '<option value="">모든 난이도</option>' + diffsOf($('gameSel').value).map(function(d){ return '<option value="' + d[0] + '">' + d[1] + '</option>'; }).join(''); $('diffSel').value = diffsOf($('gameSel').value).some(function(d){ return d[0] === v; }) ? v : ''; };
  const TABS = [['correct','정답 착지'],['time','플레이 시간'],['accuracy','정확도']];
  const $ = function(id){ return document.getElementById(id); };
  const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  const num = function(n){ return Number(n || 0).toLocaleString('ko-KR'); };
  const dur = function(s){ s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + '시간 ' + m + '분' : m ? m + '분' : s + '초'; };
  const monthLabel = function(m){ return m ? Number(m.slice(0, 4)) + '년 ' + Number(m.slice(5, 7)) + '월' : ''; };
  const rankHTML = function(r){ return '<span class="rank' + (r <= 3 ? ' r' + r : '') + '">' + r + '</span>'; };

  if (window.CMApp && CMApp.saekdong) $('sdMarkTop').innerHTML = CMApp.saekdong(30);
  let collector = '', data = null, tab = TABS.some(function(t){ return t[0] === q.tab; }) ? q.tab : 'correct';
  $('gameSel').innerHTML = GAMES.map(function(g){ return '<option value="' + g[0] + '">' + g[1] + '</option>'; }).join('');
  $('gameSel').value = GAMES.some(function(g){ return g[0] === q.game; }) ? q.game : 'stroop';
  fillDiff(q.diff || '');
  if (/^(1-2|3-4|5-6)$/.test(q.band || '')) $('bandSel').value = q.band;
  let month = q.month || '';

  function syncUrl(){
    const p = new URLSearchParams();
    if (q.c) p.set('c', q.c);
    if (q.me) p.set('me', q.me);
    p.set('game', $('gameSel').value);
    if ($('diffSel').value) p.set('diff', $('diffSel').value);
    if ($('bandSel').value) p.set('band', $('bandSel').value);
    if (month) p.set('month', month);
    if (tab !== 'correct') p.set('tab', tab);
    history.replaceState(null, '', '?' + p.toString());
  }

  function load(){
    $('body').innerHTML = '<div class="loading">현황판을 불러오는 중…</div>';
    syncUrl();
    const url = collector + '?api=matBoard&game=' + encodeURIComponent($('gameSel').value) +
      '&diff=' + encodeURIComponent($('diffSel').value) + '&band=' + encodeURIComponent($('bandSel').value) +
      (month ? '&month=' + encodeURIComponent(month) : '');
    fetch(url, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(res){
      if (!res || !res.ok) throw new Error((res && res.error) || '응답이 이상해요');
      if (!('correct' in res.result)) throw new Error('중앙 수집기가 아직 예전 판이에요 (v6 필요)');
      data = res.result; render();
    }).catch(function(e){
      $('body').innerHTML = '<div class="err">현황판을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.<br><span style="font-weight:500">' + esc(e.message || e) + '</span></div>';
    });
  }

  // 순위 보여 주기 (점퍼스 Jump Earth! 와 같은 방식)
  //  학교 순위: 5등까지 먼저, 더보기로 10등까지 · 우리 학교는 순위 밖이어도 그 아래 늘 한 줄
  //  학교 줄을 누르면 학교 안 5등까지 + 학교 안 전체 순위 팝업
  //  학생 순위: 10등까지, 나머지는 팝업(10명씩 쪽 나누기, 50등까지) + 이름 찾기
  let me = q.me || '';
  try { if (!me) me = localStorage.getItem('cm_me') || ''; } catch (e) {}
  let openPid = '';
  const FOLD = 5, SCH_MAX = 10, SHOW_STU = 10, PER = 10, folds = { sch: false };
  const valHead = function(t){ return t === 'correct' ? '정답 착지' : t === 'time' ? '플레이 시간' : '정확도'; };
  const valCell = function(x, t){ return t === 'correct' ? num(x.correct) + '<span class="sub">/ ' + num(x.attempts) + '번</span>' : t === 'time' ? dur(x.sec) : x.acc + '%<span class="sub">완주 ' + num(x.runs) + '판</span>'; };
  const stuHead = function(t){ return '<tr><th>순위</th><th>이름</th><th class="hide-sm">학년</th><th>학교</th><th class="num">' + valHead(t) + '</th></tr>'; };
  const stuRow = function(t){ return function(x){ return '<tr' + (me && x.pid === me ? ' class="me"' : '') + '><td>' + rankHTML(x.rank) + '</td><td><b>' + esc(x.n) + '</b></td><td class="hide-sm">' + esc(x.g) + '학년</td><td class="' + (/^익명 학교/.test(x.school) ? 'anon' : '') + '">' + esc(x.school) + '</td><td class="num mono">' + valCell(x, t) + '</td></tr>'; }; };
  const IN_HEAD = '<tr><th>학교 안 순위</th><th>이름</th><th class="num">정답 착지</th><th class="num">플레이 시간</th></tr>';
  const inRow = function(x){ return '<tr><td>' + rankHTML(x.rank) + '</td><td><b>' + esc(x.n) + '</b>' + (x.g ? '<span class="sub">' + esc(x.g) + '학년</span>' : '') + '</td><td class="num mono">' + num(x.correct) + '<span class="sub">/ ' + num(x.attempts) + '번</span></td><td class="num mono">' + dur(x.sec) + '</td></tr>'; };
  const table = function(head, rows, row, cls){ return '<table' + (cls ? ' class="' + cls + '"' : '') + '><thead>' + head + '</thead><tbody>' + rows.map(row).join('') + '</tbody></table>'; };

  // 팝업
  function openModal(title, sub, bodyHtml, tabs){
    closeModal();
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'rankModal';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>' + title + (sub ? '<span class="hint">' + sub + '</span>' : '') + '</h3><button type="button" class="modal-x" aria-label="닫기">×</button></div>' +
      (tabs ? '<div class="modal-tabs">' + tabs + '</div>' : '') + '<div class="modal-body">' + bodyHtml + '</div></div>';
    bg.addEventListener('click', function(e){ if (e.target === bg || e.target.closest('.modal-x')) closeModal(); });
    document.addEventListener('keydown', escClose);
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
    return bg;
  }
  function escClose(e){ if (e.key === 'Escape') closeModal(); }
  function closeModal(){ const m = $('rankModal'); if (m) m.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', escClose); }

  // 이름 찾기: 이름은 가운데가 * 로 가려져 있어서, 찾는 이름도 똑같이 가려서 맞춰 봐요 (김하늘 → 김*늘)
  function matcher(qv){
    const s = String(qv || '').replace(/\s+/g, '');
    if (!s) return null;
    if (s.indexOf('*') >= 0) { const re = new RegExp('^' + s.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.') + '$'); const t = s.replace(/\*/g, ''); return function(x){ return re.test(x.n) || (t.length > 1 && String(x.school || '').indexOf(t) >= 0); }; }
    // 앞에서부터 한 글자씩: 가려진 * 자리는 어떤 글자든 맞는 걸로 (강 → 강민 → 강민호 모두 '강*호'를 찾아요)
    const qc = Array.from(s);
    const nameOk = function(nm){ const c = Array.from(String(nm)); return qc.length <= c.length && qc.every(function(ch, i){ return c[i] === '*' || c[i] === ch; }); };
    return function(x){ return nameOk(x.n) || String(x.n).indexOf(s) >= 0 || (s.length > 1 && String(x.school || '').replace(/\s+/g, '').indexOf(s) >= 0); };
  }
  function rankPopup(o){
    const rows = o.rows, pages = Math.ceil(rows.length / PER);
    let page = 0;
    const tabs = pages > 1 ? rows.filter(function(x, i){ return i % PER === 0; }).map(function(x, p){
      return '<button type="button" data-pg="' + p + '">' + (p * PER + 1) + '~' + Math.min(rows.length, (p + 1) * PER) + '등</button>';
    }).join('') : '';
    const bg = openModal(o.title, o.sub, '<div class="pop-list"></div>', '<input type="search" class="pop-search" placeholder="' + (o.school ? '이름 찾기 (예: 김하늘)' : '이름이나 학교 찾기 (예: 김하늘)') + '" aria-label="찾기">' + (tabs ? '<div class="pop-pages">' + tabs + '</div>' : ''));
    const list = bg.querySelector('.pop-list'), inp = bg.querySelector('.pop-search'), pg = bg.querySelector('.pop-pages');
    const draw = function(){
      const m = matcher(inp.value);
      let show;
      if (m) { show = rows.filter(m); if (pg) pg.style.display = 'none'; }
      else { show = rows.slice(page * PER, (page + 1) * PER); if (pg) { pg.style.display = ''; Array.prototype.forEach.call(pg.children, function(b){ b.classList.toggle('on', Number(b.dataset.pg) === page); }); } }
      list.innerHTML = show.length ? table(o.head, show, o.row) : '<p class="pop-empty">찾는 이름이 ' + (o.school ? '이 학교 순위에' : rows.length + '등 안에') + ' 없어요.<br><span class="hint">이름은 가운데를 가려서 보여 줘요 (김하늘 → 김*늘)</span></p>';
    };
    inp.addEventListener('input', draw);
    if (pg) pg.addEventListener('click', function(e){ const b = e.target.closest('[data-pg]'); if (b) { page = Number(b.dataset.pg); draw(); } });
    draw();
  }

  // 학교 하나의 자료 (그 학교 줄 + 학교 안 학생 전체) — 새 수집기(11판)에서만
  const scd = {};
  const filterKey = function(){ return [data.month, data.game, data.diff || '', data.band || ''].join('|'); };
  function schoolData(pid){
    if (!data.v) return { school: null, students: [], old: true };
    const k = pid + '|' + filterKey(), hit = scd[k];
    if (hit) return hit.loading ? null : hit;
    scd[k] = { loading: true };
    const fk = filterKey();
    fetch(collector + '?api=matSchool&pid=' + encodeURIComponent(pid) + '&month=' + encodeURIComponent(data.month) + '&game=' + encodeURIComponent(data.game) +
      '&diff=' + encodeURIComponent(data.diff || '') + '&band=' + encodeURIComponent(data.band || ''), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || ''); scd[k] = j.result; })
      .catch(function(){ scd[k] = { err: true, students: [] }; })
      .then(function(){ if (data && filterKey() === fk) render(); });
    return null;
  }
  function schoolDetail(sc){
    const d = schoolData(sc.pid);
    if (!d) return '<p class="hint" style="margin:6px 0;">학교 안 순위를 불러오는 중…</p>';
    if (d.err) return '<p class="hint" style="margin:6px 0;">학교 안 순위를 불러오지 못했어요. 잠시 뒤 다시 눌러 보세요.</p>';
    const st = d.students || [];
    if (!st.length) return '<p class="hint">학생 기록이 없어요.</p>';
    return table(IN_HEAD, st.slice(0, FOLD), inRow, 'mini') +
      '<div class="more-row"><button type="button" class="more-btn" data-insch="' + esc(sc.pid) + '">학교 안 전체 순위 보기 · ' + st.length + '명 →</button></div>';
  }

  function render(){
    const d = data;
    // 달 고르기: 기록이 있는 달 + 이번 달
    const months = (d.months || []).slice();
    if (months.indexOf(d.current) < 0) months.unshift(d.current);
    if (months.indexOf(d.month) < 0) months.push(d.month);
    months.sort().reverse();
    $('monthSel').innerHTML = months.map(function(m){ return '<option value="' + m + '">' + monthLabel(m) + (m === d.current ? ' (이번 달)' : '') + '</option>'; }).join('');
    $('monthSel').value = d.month;

    const gameName = ($('gameSel').selectedOptions[0] || {}).textContent || '';
    const filt = [gameName, d.diff ? CMApp.diffName($('gameSel').value, d.diff) : '', d.band ? d.band.replace('-', '~') + '학년' : ''].filter(Boolean).join(' · ');
    const s = d.summary || {};
    let h = '<div class="bw-l">';
    if (d.climb && window.CMApp && CMApp.climbHTML) {
      const y = d.climb.year, ys = d.climb.years || {};
      h += CMApp.climbHTML(Number(ys[y]) || 0, '🚀 다 함께 하늘까지 · ' + y + '학년도 전국', Number(ys[String(Number(y) - 1)]) || 0);
    }
    h += '<div class="kpis">' +
      '<div class="kpi"><span>참여 학교</span><b class="mono">' + num(s.schools) + '</b></div>' +
      '<div class="kpi"><span>참여 학생</span><b class="mono">' + num(s.students) + '</b></div>' +
      '<div class="kpi"><span>누적 정답 착지</span><b class="mono">' + num(s.correct) + '</b></div>' +
      '<div class="kpi"><span>누적 플레이 시간</span><b class="mono">' + dur(s.sec) + '</b></div></div>' + '</div><div class="bw-r">';

    if (!s.students) {
      h += '<div class="card"><div class="empty">' + esc(monthLabel(d.month)) + ' ' + esc(filt) + ' 기록이 아직 없어요.<br>카메라 판정으로 뛰고 선생님이 확인하면 여기에 올라와요!</div></div></div>';
      $('body').innerHTML = h; return;
    }

    // 학교 순위
    const top = (d.schools || []).slice(0, SCH_MAX);
    const shown = top.slice(0, folds.sch ? SCH_MAX : FOLD);
    let mine = null;
    if (me && d.v && !shown.some(function(x){ return x.pid === me; })) {
      mine = top.filter(function(x){ return x.pid === me; })[0] || null;
      if (!mine) { const sd = schoolData(me); mine = sd && sd.school; }
    }
    const canOpen = !!d.v;
    const schRow = function(x, tail){
      const isMe = me && x.pid === me;
      let r = '<tr class="school' + (canOpen ? ' click' : '') + (isMe ? ' me' : '') + (tail ? ' tail' : '') + '"' + (canOpen ? ' data-pid="' + esc(x.pid) + '"' : '') + '><td>' + rankHTML(x.rank) + '</td><td class="' + (x.named ? '' : 'anon') + '"><b>' + esc(x.label) + '</b>' + (isMe ? '<span class="tag-me">우리 학교</span>' : '') + '</td><td class="num hide-sm mono">' + num(x.participants) + '명</td><td class="num hide-sm mono">' + dur(x.sec) + '</td><td class="num mono"><b>' + num(x.correct) + '</b></td></tr>';
      if (canOpen && openPid === x.pid) r += '<tr class="detail"><td colspan="5">' + schoolDetail(x) + '</td></tr>';
      return r;
    };
    const nSchools = d.schoolsTotal || s.schools || top.length;
    h += '<div class="card"><div class="card-head"><div><h2>학교 순위</h2><span class="hint">학생들이 모은 정답 착지 합' + (canOpen ? ' · 학교 줄을 누르면 그 학교 안 학생 순위가 보여요' : '') + '</span></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>순위</th><th>학교</th><th class="num hide-sm">참여 학생</th><th class="num hide-sm">플레이 시간</th><th class="num">정답 착지</th></tr></thead><tbody>' +
      shown.map(function(x){ return schRow(x); }).join('') + (mine ? '<tr class="gap"><td colspan="5">⋯</td></tr>' + schRow(mine, true) : '') + '</tbody></table></div>';
    if (top.length > FOLD) h += '<div class="fold-row"><button type="button" class="more-btn" data-fold="sch">' + (folds.sch ? '접기 ▴' : (FOLD + 1) + '~' + top.length + '등 더보기 ▾') + '</button></div>';
    h += '<p class="hint" style="margin:10px 0 0;">참여 ' + num(nSchools) + '개 학교 중 ' + SCH_MAX + '등까지 보여요' + (me && d.v ? ' (우리 학교는 늘 보여요)' : '') + '.</p></div>';

    // 학생 순위: 10등까지, 나머지는 팝업
    h += '<div class="card"><div class="card-head"><div><h2>학생 순위</h2><span class="hint">' + esc(monthLabel(d.month)) + ' · ' + esc(filt) + '</span></div>' +
      '<div class="seg" id="tabSeg">' + TABS.map(function(t){ return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div></div>';
    if (tab === 'accuracy') h += '<p class="hint">5분 한 판을 끝까지 완주한 판만 정확도에 들어가요.</p>';
    const list = d[tab] || [];
    if (!list.length) h += '<div class="empty">' + (tab === 'accuracy' ? '아직 완주한 기록이 없어요. 끝까지 뛰어서 첫 주인공이 되어 보세요!' : '아직 기록이 없어요.') + '</div>';
    else {
      h += '<div class="table-wrap">' + table(stuHead(tab), list.slice(0, SHOW_STU), stuRow(tab)) + '</div>';
      h += '<div class="more-row"><button type="button" class="more-btn" id="stuMore">' + (list.length > SHOW_STU ? '전국 ' + list.length + '등까지 보기 · 이름 찾기 →' : '이름 찾기 →') + '</button></div>';
    }
    h += '</div></div>';

    $('body').innerHTML = h;
    const seg = $('tabSeg');
    if (seg) seg.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ tab = b.dataset.t; syncUrl(); render(); }; });
    $('body').querySelectorAll('[data-fold]').forEach(function(b){ b.onclick = function(){ folds[b.dataset.fold] = !folds[b.dataset.fold]; render(); }; });
    $('body').querySelectorAll('tr.school.click').forEach(function(tr){ tr.onclick = function(){ openPid = openPid === tr.dataset.pid ? '' : tr.dataset.pid; render(); }; });
    $('body').querySelectorAll('[data-insch]').forEach(function(b){ b.onclick = function(e){
      e.stopPropagation();
      const sd = schoolData(b.dataset.insch); if (!sd) return;
      const sc = sd.school || {}, rows = sd.students || [];
      rankPopup({ title: esc(sc.label || '') + ' · 학교 안 순위', sub: esc(monthLabel(d.month)) + ' · ' + esc(filt) + ' · ' + rows.length + '명', rows: rows, head: IN_HEAD, row: inRow, school: true });
    }; });
    if ($('stuMore')) $('stuMore').onclick = function(){
      rankPopup({ title: '학생 순위 · ' + valHead(tab) + ' · ' + list.length + '등까지', sub: esc(monthLabel(d.month)) + ' · ' + esc(filt), rows: list, head: stuHead(tab), row: stuRow(tab) });
    };
  }

  $('gameSel').onchange = function(){ fillDiff(''); openPid = ''; load(); };
  ['diffSel', 'bandSel'].forEach(function(id){ $(id).onchange = load; });
  $('monthSel').onchange = function(){ month = $('monthSel').value; load(); };

  fetch('national.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(cfg){
    collector = q.c || (cfg && cfg.collector) || '';
    if (!collector) { $('body').innerHTML = '<div class="err">전국 현황판이 아직 준비 중이에요. 곧 열립니다!</div>'; return; }
    load();
  });
})();
</script>
</body>
</html>
