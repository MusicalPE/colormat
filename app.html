<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색깔 매트 놀이터 — 우리 학교</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2392F">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="매트 놀이터">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1F2937; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
    --line:#E5E7EB; --line-2:#EEF0F3; --coral:#FF6B5B; --coral-dark:#DC4B3B; --coral-tint:#FFF1EE;
    --ok:#16A34A; --ok-tint:#DCFCE7; --warn:#B45309; --warn-tint:#FEF3C7; --bad:#DC2626; --bad-tint:#FEE2E2;
    --red:#F2392F; --yellow:#FFD21F; --green:#2FC653; --blue:#4C88FF;
    --r-md:14px; --r-lg:18px; --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);margin:0;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .container{max-width:980px;margin:0 auto;padding:20px 16px 80px}
  .mono{font-variant-numeric:tabular-nums}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .brand{font-weight:800;font-size:1.08em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:600;color:var(--muted);font-size:.8em}
  .logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:22px;height:22px}.logo i{border-radius:3px}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:.9em;cursor:pointer}
  .pill:hover,.pill.on{border-color:var(--coral);color:var(--coral-dark);background:var(--coral-tint)}
  .hero{background:linear-gradient(135deg,#F2392F 0%,#FF8A3D 45%,#2FC653 120%);color:#fff;border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
  .hero h1{margin:0 0 4px;font-size:1.45em}.hero p{margin:0;opacity:.94}
  .card{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 6px;font-size:1.15em}
  .hint{color:var(--muted);font-size:.88em;margin:4px 0 10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;font-size:.95em;cursor:pointer;background:var(--coral);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1.5px solid var(--line)}
  .btn.green{background:var(--ok)}.btn.red{background:var(--bad)}
  .btn.big{width:100%;padding:16px;font-size:1.1em;border-radius:14px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .row label{font-size:.9em;color:var(--muted);font-weight:700;min-width:72px}
  input[type=text],input[type=password],input[type=url],select,textarea{font:inherit;font-size:.95em;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.88em}
  .seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.88em;padding:7px 13px;border-radius:999px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--coral-dark);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink-2)}
  .chip.on{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-dark)}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
  .name{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font:inherit;font-weight:800;font-size:1.05em;cursor:pointer;color:var(--ink)}
  .name small{display:block;font-weight:600;color:var(--faint);font-size:.75em}
  .name.on{border-color:var(--coral);background:var(--coral-tint)}
  .who{display:flex;align-items:center;gap:12px;background:var(--coral-tint);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .who b{font-size:1.2em}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:0;background:#fff;box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--ink);color:#fff}
  .tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:.78em;margin-left:4px}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:.8em;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 6px;border-bottom:1px solid var(--line-2);font-size:.92em;word-break:keep-all}
  th.num,td.num{text-align:right;white-space:nowrap}
  .badge{display:inline-block;font-size:.75em;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .b-ok{background:var(--ok-tint);color:var(--ok)}.b-wait{background:var(--warn-tint);color:var(--warn)}.b-no{background:var(--bad-tint);color:var(--bad)}.b-cam{background:#E0E7FF;color:#4338CA}.b-done{background:#F3E8FF;color:#7E22CE}
  .empty{text-align:center;color:var(--muted);padding:26px 10px}
  .msg{border-radius:12px;padding:11px 14px;font-weight:700;margin-bottom:12px}
  .msg.err{background:var(--warn-tint);color:#92400E}.msg.ok{background:var(--ok-tint);color:#166534}.msg.info{background:#EFF6FF;color:#1E40AF}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line-2)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .switch{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
  .switch input{width:20px;height:20px;accent-color:var(--coral)}
  .loading{text-align:center;color:var(--muted);padding:40px}
  .foot{text-align:center;color:var(--faint);font-size:.8em;margin-top:24px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--bg);border-radius:12px;padding:10px 12px}.kpi span{color:var(--muted);font-size:.8em;font-weight:700}.kpi b{display:block;font-size:1.3em}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}td,th{padding-left:4px;padding-right:4px}}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="brand" href="#" id="brand"><span class="logo"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></span><span id="brandName">색깔 매트 놀이터</span></a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="view"><div class="loading">불러오는 중…</div></div>
  <p class="foot">Made by <b>음악적체육인</b> · <span id="ver"></span></p>
</div>

<script src="cm-app.js"></script>
<script>
(function(){
'use strict';
const VERSION = 'app v1.0.1';
const REQUIRED_SHELL = 1;
const GAME_NAME = { stroop:'색깔 스트룹', basic:'색깔 점프', memory:'기억력 스텝', rhythm:'리듬 스텝', dir:'방향 점프', quiz:'퀴즈 점프', assoc:'연상 점프', twist:'손발 트위스터', freeze:'얼음 스텝', lava:'용암 매트' };
const DIFF = { normal:'노말', hard:'하드', expert:'익스퍼트' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString('ko-KR');
const dur = s => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? h+'시간 '+m+'분' : m ? m+'분 '+(s%60? s%60+'초':'') : s+'초'; };
const q = Object.fromEntries(new URLSearchParams(location.search));
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
$('ver').textContent = VERSION;

const APP = { s: q.s || '', pub: null, view: q.page === 'admin' ? 'admin' : 'student', token: null, data: null, tab: 'pending' };
try { const t = JSON.parse(sessionStorage.getItem('cm_token|' + APP.s) || 'null'); if (t && t.exp > Date.now()) APP.token = t.token; } catch (e) {}

function rpc(fn, args){
  return fetch(APP.s, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), redirect:'follow' })
    .then(r => { if (!r.ok) throw new Error('학교 시트 응답 오류 (' + r.status + ')'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || '요청 실패'); return j.result; });
}
function selfUrl(page){ return location.href.split('?')[0] + '?s=' + encodeURIComponent(APP.s) + (page ? '&page=' + page : ''); }
function setNav(){
  if (!APP.s) { $('nav').innerHTML = '<button class="pill" id="cmInstallBtn">📲 바로가기</button>'; window.CMApp && wireInstall(); return; }
  $('nav').innerHTML =
    '<button class="pill ' + (APP.view==='student'?'on':'') + '" data-go="student">🙋 학생</button>' +
    '<button class="pill ' + (APP.view==='admin'?'on':'') + '" data-go="admin">🧑‍🏫 선생님</button>' +
    '<button class="pill" id="qrBtn">📱 QR</button>' +
    '<button class="pill" id="cmInstallBtn">📲 바로가기</button>';
  $('nav').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { APP.view = b.dataset.go; history.replaceState(null, '', selfUrl(APP.view==='admin'?'admin':'')); render(); });
  $('qrBtn').onclick = () => CMApp.showQrList([
    { key:'stu', label:'🙋 학생 화면', url: selfUrl(), note:'학생 휴대폰·태블릿으로 찍으면 우리 학교 매트 놀이터가 열려요. 이름을 고르고 카메라 판정으로 뛰어요.' },
    { key:'board', label:'🏆 전국 현황판', url: CMApp.ROOT + 'board.html', note:'찍으면 전국 매트 현황판이 열려요.' }
  ]);
  wireInstall();
}
function wireInstall(){ const b = $('cmInstallBtn'); if (b) b.onclick = () => CMApp.showInstall(); }

/* ================= 처음 설치 ================= */
function renderSetup(){
  const last = LS.get('cm_last_shell', '');
  $('view').innerHTML =
    '<div class="hero"><h1>우리 학교 매트 기록 시작하기</h1><p>구글 시트 하나에 학생·기록을 모으고, 카메라 판정 기록을 전국 현황판에 올려요</p></div>' +
    (last ? '<div class="card"><h2>지난번에 쓰던 학교 시트</h2><p class="hint" style="word-break:break-all">' + esc(last) + '</p><a class="btn" href="?s=' + encodeURIComponent(last) + '">이어서 열기 →</a></div>' : '') +
    '<div class="card"><h2>처음 설치하기 (5분)</h2><ol class="steps">' +
      '<li><b>새 구글 스프레드시트</b>를 만들고 이름을 정해요 (예: 우리 반 매트 기록).</li>' +
      '<li>메뉴 <b>확장 프로그램 → Apps Script</b>를 열어요.</li>' +
      '<li>원래 있던 내용을 지우고 <b>껍데기 코드</b>를 붙여넣고 저장해요. <button class="btn ghost" id="copyShell" style="padding:6px 12px;margin-left:6px">📋 껍데기 코드 복사</button></li>' +
      '<li><b>배포 → 새 배포 → 웹 앱</b>: 다음 사용자로 실행 = <b>나</b>, 액세스 권한 = <b>모든 사용자</b> → 배포 (권한 허용).</li>' +
      '<li>나온 <b>웹 앱 주소(…/exec)</b>를 열고 <b>프로그램 열기</b>를 누르면 끝! (또는 아래에 주소를 붙여넣어도 돼요) 처음 관리자 비밀번호는 <b>1234</b>예요.</li>' +
    '</ol>' +
    '<div class="row" style="margin-top:12px"><input type="url" id="shellIn" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:240px"><button class="btn" id="goShell">열기</button></div>' +
    '<p class="hint">줄넘기 기록 관리 프로그램을 쓰고 있어도 시트는 따로 만들어요. 학교 키는 따로 생기지만, 전국 현황판에는 같은 학교 이름으로 보여요.</p></div>';
  $('copyShell').onclick = function(){
    const b = this;
    fetch('Shell.gs', { cache:'no-store' }).then(r => r.text()).then(t => navigator.clipboard.writeText(t)).then(() => { b.textContent = '복사했어요 ✓'; }, () => { window.open('Shell.gs', '_blank'); });
  };
  $('goShell').onclick = () => {
    const v = $('shellIn').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) { alert('…/exec 로 끝나는 웹 앱 주소를 붙여넣어 주세요.'); return; }
    location.href = '?s=' + encodeURIComponent(v) + '&page=admin';
  };
}

/* ================= 학생 화면 ================= */
const STU = { cls: LS.get('cm_cls|' + APP.s, ''), sid: '', rule: 'ink', mode: '1', speed: '1' };
function renderStudent(){
  const list = APP.pub.students || [];
  if (!list.length) {
    $('view').innerHTML = '<div class="hero"><h1>' + esc(APP.pub.title || '색깔 매트 놀이터') + '</h1><p>이름을 고르고 카메라 판정으로 뛰어요</p></div><div class="card"><div class="empty">아직 학생이 등록되지 않았어요.<br>선생님 메뉴에서 학생을 등록해 주세요.</div></div>';
    return;
  }
  const clsKey = s => (s.grade ? s.grade + '학년 ' : '') + (s.cls ? s.cls + '반' : '');
  const classes = [...new Set(list.map(clsKey))];
  if (!classes.includes(STU.cls)) STU.cls = classes[0];
  const names = list.filter(s => clsKey(s) === STU.cls);
  const me = list.find(s => s.id === STU.sid);
  let h = '<div class="hero"><h1>' + esc(APP.pub.title || '색깔 매트 놀이터') + '</h1><p>이름을 고르고 카메라 판정으로 뛰어요 · 끝까지(5분) 뛰면 완주 기록!</p></div>' + climbCard(APP.pub.climb);
  if (!me) {
    h += '<div class="card"><h2>누구인가요?</h2>' + (classes.length > 1 ? '<div class="chips">' + classes.map(c => '<button class="chip ' + (c===STU.cls?'on':'') + '" data-cls="' + esc(c) + '">' + esc(c || '우리 반') + '</button>').join('') + '</div>' : '') +
      '<div class="names">' + names.map(s => '<button class="name" data-sid="' + esc(s.id) + '">' + esc(s.name) + '<small>' + esc(s.number ? s.number + '번' : '') + '</small></button>').join('') + '</div></div>';
  } else {
    h += '<div class="card"><div class="who"><span style="font-size:1.8em">🙋</span><div><small class="hint" style="margin:0">' + esc(clsKey(me)) + ' ' + esc(me.number ? me.number + '번' : '') + '</small><br><b>' + esc(me.name) + '</b></div><button class="btn ghost" id="notMe" style="margin-left:auto">내가 아니에요</button></div>' +
      '<h2>색깔 스트룹</h2><p class="hint">놀이터와 같은 규칙 · 10단계 × 30초 · 카메라가 채점해요</p>' +
      '<div class="row"><label>보고 밟기</label><div class="seg" data-k="rule"><button data-v="ink">글자 색깔</button><button data-v="word">글자 읽기</button></div></div>' +
      '<div class="row"><label>모드</label><div class="seg" data-k="mode"><button data-v="1">노말</button><button data-v="2">하드</button><button data-v="3">익스퍼트</button></div></div>' +
      '<div class="row"><label>속도</label><div class="seg" data-k="speed"><button data-v="1.25">천천히</button><button data-v="1">보통</button><button data-v="0.8">빠르게</button></div></div>' +
      '<button class="btn big" id="goCam" style="margin-top:10px">📷 카메라 판정으로 시작!</button>' +
      '<p class="hint" style="text-align:center;margin-top:10px">' + (APP.pub.approvalOn ? '기록은 선생님이 확인하면 인정돼요.' : '기록은 바로 저장돼요.') + '</p></div>';
  }
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-cls]').forEach(b => b.onclick = () => { STU.cls = b.dataset.cls; LS.set('cm_cls|' + APP.s, STU.cls); renderStudent(); });
  $('view').querySelectorAll('[data-sid]').forEach(b => b.onclick = () => { STU.sid = b.dataset.sid; renderStudent(); });
  if (me) {
    $('notMe').onclick = () => { STU.sid = ''; renderStudent(); };
    $('view').querySelectorAll('.seg[data-k]').forEach(seg => {
      const k = seg.dataset.k;
      seg.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.v === STU[k]); b.onclick = () => { STU[k] = b.dataset.v; renderStudent(); }; });
    });
    $('goCam').onclick = () => {
      const p = new URLSearchParams({ s: APP.s, sid: me.id, who: me.name, grade: String(me.grade || ''), rule: STU.rule, mode: STU.mode, speed: STU.speed, back: selfUrl() });
      location.href = 'checker/index.html?' + p.toString();
    };
  }
}

function climbCard(c){
  if (!c || !window.CMApp || !CMApp.climbHTML) return '';
  const ys = c.years || {};
  return CMApp.climbHTML(Number(ys[c.year]) || 0, '🚀 우리 학교 하늘까지 · ' + c.year + '학년도', Number(ys[String(Number(c.year) - 1)]) || 0);
}
// 선생님 화면용: 기록에서 바로 계산 (승인된 카메라 판정 정답 착지)
function climbFromRecords(records){
  const sy = d => { const y = +d.slice(0,4), m = +d.slice(5,7); return String(m >= 3 ? y : y - 1); };
  const now = new Date(), cur = sy(now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'));
  const years = {};
  records.forEach(r => { if (r.status === 'approved' && r.camera && r.date) years[sy(r.date)] = (years[sy(r.date)] || 0) + r.correct; });
  return { year: cur, years };
}

/* ================= 전국 현황판 보내기 =================
   학교 밖으로 나가는 것: 가린 이름(김*늘)·학년·날짜별 게임·난이도·정답/시도·플레이 시간·완주 (반·번호·실명은 안 나감)
   카메라 판정 + 승인된 기록만, 이번 달과 지난 달 */
const NAT = {
  collector: '',
  load(){ return this.collector ? Promise.resolve() : fetch('national.json', { cache:'no-store' }).then(r => r.json()).then(j => { this.collector = j.collector || ''; }).catch(() => {}); },
  cfg(){ return (APP.data && APP.data.extra && APP.data.extra.nat) || {}; },
  sha(t){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(b => Array.from(new Uint8Array(b)).map(x => (x<16?'0':'') + x.toString(16)).join('')); },
  mask(n){ const c = Array.from(String(n||'').trim()); if (c.length<=1) return c.join(''); if (c.length===2) return c[0]+'*'; return c[0]+'*'.repeat(c.length-2)+c[c.length-1]; },
  newKey(){ try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => (b<16?'0':'')+b.toString(16)).join(''); },
  deployId(u){ const m = String(u).match(/\/s\/([A-Za-z0-9_-]{20,})\//); return m ? m[1] : String(u); },
  moved(){ const c = this.cfg(); return !!(c.on && c.shell && c.shell !== this.deployId(APP.s)); },
  post(fn, payload){
    return fetch(this.collector, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args:[payload] }), redirect:'follow' })
      .then(r => { if (!r.ok) throw new Error('현황판 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error || '현황판 요청 실패'); return j.result; });
  },
  sync(){
    const c = this.cfg();
    if (!c.on || !c.key || !APP.data.approvalOn || this.moved()) return Promise.resolve(null);
    return this.load().then(() => {
      if (!this.collector) return null;
      const now = new Date(), pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const from = pm.getFullYear() + '-' + String(pm.getMonth()+1).padStart(2,'0') + '-01';
      const byId = {}; APP.data.students.forEach(s => byId[s.id] = s);
      const agg = {}, dates = {};
      APP.data.records.forEach(r => {
        if (!r.date || r.date < from) return;
        dates[r.date] = 1;                                    // 승인을 취소한 날도 다시 보내서 덮어쓰게
        if (r.status !== 'approved' || !r.camera || !byId[r.studentId]) return;
        const k = [r.date, r.studentId, r.game, r.difficulty].join('|');
        const a = agg[k] || (agg[k] = { date:r.date, id:r.studentId, game:r.game, diff:r.difficulty, c:0, a:0, s:0, runs:0, dc:0, da:0 });
        a.c += r.correct; a.a += r.attempts; a.s += r.sec;
        if (r.completed) { a.runs++; a.dc += r.correct; a.da += r.attempts; }
      });
      const keys = {};
      return Promise.all(Object.keys(byId).map(id => this.sha('cm-student|' + c.key + '|' + id).then(h => keys[id] = h.slice(0,10)))).then(() => {
        const days = {};
        Object.keys(dates).forEach(d => days[d] = []);
        Object.values(agg).forEach(a => { const s = byId[a.id]; days[a.date].push([keys[a.id], this.mask(s.name), String(s.grade||''), a.game, a.diff, a.c, a.a, a.s, a.runs, a.dc, a.da]); });
        const list = Object.keys(days).sort().map(d => ({ date:d, rows:days[d] }));
        return this.post('matReport', { key:c.key, name: c.showName ? (c.name||'') : '', showName: !!c.showName, schoolName: c.name || '', days: list })
          .then(res => { LS.set('cm_nat_last|' + APP.s, Date.now()); return res; });
      });
    });
  }
};

    (err ? '<div class="msg err">' + esc(err) + '</div>' : '') +

  $('lf').onsubmit = e => {
    e.preventDefault();
    rpc('verifyAdminPassword', [$('pw').value]).then(r => {
      if (!r.ok) return renderLogin(r.message);
      APP.token = r.token; APP.isDefaultPw = r.isDefault;
      try { sessionStorage.setItem('cm_token|' + APP.s, JSON.stringify({ token:r.token, exp: Date.now() + 55*60*1000 })); } catch (e) {}

function loadAdmin(msg){
  if (!APP.token) return renderLogin();
  return rpc('getAllDataAdmin', [APP.token]).then(d => { APP.data = d; APP.pub = { title:d.title, approvalOn:d.approvalOn, students:d.students }; renderAdmin(msg); })
    .catch(e => { if (/권한/.test(e.message)) { APP.token = null; renderLogin('로그인 시간이 지났어요. 다시 들어와 주세요.'); } else $('view').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function syncAfter(note){
  return NAT.sync().then(r => r ? note + ' · 전국 현황판에도 반영했어요' : note).catch(e => note + ' · (전국 현황판 보내기 실패: ' + e.message + ')');

  }
  $('view').innerHTML = h;

  const need = ids => { if (!ids.length) { alert('먼저 기록을 골라 주세요.'); return false; } return true; };
  if (APP.tab === 'pending' && pending.length) {

    const parse = () => $('bulk').value.split(/\r?\n/).map(l => l.split(/\t|,/).map(x => x.trim())).filter(c => c.length >= 4 && c[3] && /^\d*$/.test(c[0].replace(/학년/,'')) && !/이름/.test(c[3])).map(c => [c[0].replace(/학년/,''), c[1].replace(/반/,''), c[2].replace(/번/,''), c[3]]);
    $('bulk').oninput = () => { $('bulkInfo').textContent = parse().length + '명 인식'; };
    $('bulkGo').onclick = () => { const rows = parse(); if (!rows.length) return alert('학년·반·번호·이름 네 칸을 붙여넣어 주세요.'); act(rpc('addStudentsBulk', [APP.token, rows]).then(r => { APP._added = r.added; }), rows.length + '명 중 새 학생을 등록했어요'); };
    if ($('stuDel')) $('stuDel').onclick = () => { const ids = picked(); if (ids.length && confirm(ids.length + '명과 그 기록을 지울까요?')) act(rpc('deleteStudents', [APP.token, ids]), ids.length + '명을 지웠어요'); };
  }
  if (APP.tab === 'settings') {
    const natPatch = o => rpc('setExtraSettings', [APP.token, { nat: Object.assign({}, NAT.cfg(), o) }]);
    const name = () => $('natName').value.trim();
    if ($('natOn')) $('natOn').onclick = () => { if (!name()) return alert('학교 이름을 넣어 주세요.'); act(natPatch({ on:true, key: NAT.cfg().key || NAT.newKey(), name: name(), showName: $('natShow').checked, shell: NAT.deployId(APP.s) }), '전국 현황판에 참여했어요'); };
    if ($('natSave')) $('natSave').onclick = () => { if (!name()) return alert('학교 이름을 넣어 주세요.'); act(natPatch({ name: name(), showName: $('natShow').checked }), '저장했어요'); };
    if ($('natNew')) $('natNew').onclick = () => { if (confirm('이 시트로 새 참여 번호를 만들까요? 예전 번호의 기록은 현황판에 그대로 남아요.')) act(natPatch({ key: NAT.newKey(), shell: NAT.deployId(APP.s) }), '새 참여 번호로 참여했어요'); };
    if ($('natOff')) $('natOff').onclick = () => {
      if (!confirm('참여를 끄면 현황판에서 우리 학교 매트 기록이 지워져요. 끌까요?')) return;
      const c = NAT.cfg();
      act(NAT.load().then(() => NAT.collector && c.key ? NAT.post('leave', { key: c.key }).catch(() => null) : null).then(() => natPatch({ on:false })), '참여를 껐어요');
    };
    $('apOn').onchange = e => {
      const on = e.target.checked;
      if (!on && NAT.cfg().on && !confirm('승인 절차를 끄면 전국 현황판 참여도 꺼져요. 끌까요?')) { e.target.checked = true; return; }
      act(rpc('setAppSettings', [APP.token, { approvalOn: on }]).then(() => (!on && NAT.cfg().on) ? natPatch({ on:false }) : null), on ? '승인 절차를 켰어요' : '승인 절차를 껐어요');
    };
    $('stuQr').onclick = () => CMApp.showQrList([{ key:'stu', label:'학생 화면', url: selfUrl(), note:'학생 휴대폰·태블릿으로 찍으면 우리 학교 매트 놀이터가 열려요.' }]);
    $('copyUrl').onclick = function(){ navigator.clipboard.writeText(selfUrl()).then(() => this.textContent = '복사했어요 ✓'); };
    $('pwf').onsubmit = e => { e.preventDefault(); const a = $('np1').value, b = $('np2').value; if (a !== b) return alert('두 번 넣은 비밀번호가 달라요.'); rpc('changeAdminPassword', [APP.token, a]).then(r => { if (!r.ok) return alert(r.message); APP.isDefaultPw = false; renderAdmin('비밀번호를 바꿨어요'); }).catch(e => alert(e.message)); };
    $('logout').onclick = () => { APP.token = null; try { sessionStorage.removeItem('cm_token|' + APP.s); } catch (e) {} renderLogin(); };
  }
}

/* ================= 시작 ================= */
function render(){
  setNav();
  if (!APP.s) return renderSetup();
  if (APP.view === 'admin') return APP.data ? renderAdmin() : loadAdmin();
  return renderStudent();
}
$('brand').onclick = e => { e.preventDefault(); APP.view = 'student'; history.replaceState(null, '', APP.s ? selfUrl() : location.pathname); render(); };
// 주소에 학교 시트가 없으면: 이 기기에서 연결했던 학교 시트로 바로 이어서 열기 (?new=1 이면 새로 연결 화면)
if (!APP.s && !q.new) {
  const last = LS.get('cm_last_shell', '');
  if (last) { location.replace(location.pathname + '?s=' + encodeURIComponent(last) + (q.page ? '&page=' + encodeURIComponent(q.page) : '')); }
}
if (!APP.s) { render(); }
else {
  LS.set('cm_last_shell', APP.s);
  setNav();
  rpc('getPublic').then(p => {
    APP.pub = p;
    if (p.title) $('brandName').textContent = p.title;
    // 판정기에서 돌아왔을 때: 방금 뛴 학생을 그대로 골라 둠
    if (q.sid && (p.students || []).some(s => s.id === q.sid)) { STU.sid = q.sid; }
    render();
  }).catch(e => {
    $('view').innerHTML = '<div class="card"><div class="msg err">학교 시트에 연결하지 못했어요: ' + esc(e.message) + '</div><p class="hint">껍데기 배포 주소가 맞는지, 배포의 액세스 권한이 "모든 사용자"인지 확인해 주세요.</p><a class="btn ghost" href="app.html?new=1">다른 주소로 새로 연결하기</a></div>';
  });
}
})();
</script>
