<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색깔 매트 놀이터 — 우리 학교</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2392F">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="매트 놀이터">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1F2937; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
    --line:#E5E7EB; --line-2:#EEF0F3; --coral:#FF6B5B; --coral-dark:#DC4B3B; --coral-tint:#FFF1EE;
    --ok:#16A34A; --ok-tint:#DCFCE7; --warn:#B45309; --warn-tint:#FEF3C7; --bad:#DC2626; --bad-tint:#FEE2E2;
    --red:#F2392F; --yellow:#FFD21F; --green:#2FC653; --blue:#4C88FF;
    --r-md:14px; --r-lg:18px; --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);margin:0;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .container{max-width:980px;margin:0 auto;padding:20px 16px 80px}
  .mono{font-variant-numeric:tabular-nums}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .brand{font-weight:800;font-size:1.08em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:600;color:var(--muted);font-size:.8em}
  .logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:22px;height:22px}.logo i{border-radius:3px}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:.9em;cursor:pointer}
  .pill:hover,.pill.on{border-color:var(--coral);color:var(--coral-dark);background:var(--coral-tint)}
  .hero{background:linear-gradient(135deg,#F2392F 0%,#FF8A3D 45%,#2FC653 120%);color:#fff;border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
  .hero h1{margin:0 0 4px;font-size:1.45em}.hero p{margin:0;opacity:.94}
  .card{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 6px;font-size:1.15em}
  .hint{color:var(--muted);font-size:.88em;margin:4px 0 10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;font-size:.95em;cursor:pointer;background:var(--coral);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1.5px solid var(--line)}
  .btn.green{background:var(--ok)}.btn.red{background:var(--bad)}
  .btn.big{width:100%;padding:16px;font-size:1.1em;border-radius:14px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .row label{font-size:.9em;color:var(--muted);font-weight:700;min-width:72px}
  input[type=text],input[type=password],input[type=url],select,textarea{font:inherit;font-size:.95em;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.88em}
  .seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.88em;padding:7px 13px;border-radius:999px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--coral-dark);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink-2)}
  .chip.on{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-dark)}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
  .name{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font:inherit;font-weight:800;font-size:1.05em;cursor:pointer;color:var(--ink)}
  .name small{display:block;font-weight:600;color:var(--faint);font-size:.75em}
  .name.on{border-color:var(--coral);background:var(--coral-tint)}
  .who{display:flex;align-items:center;gap:12px;background:var(--coral-tint);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .who b{font-size:1.2em}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:0;background:#fff;box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--ink);color:#fff}
  .tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:.78em;margin-left:4px}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:.8em;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 6px;border-bottom:1px solid var(--line-2);font-size:.92em;word-break:keep-all}
  th.num,td.num{text-align:right;white-space:nowrap}
  .badge{display:inline-block;font-size:.75em;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .b-ok{background:var(--ok-tint);color:var(--ok)}.b-wait{background:var(--warn-tint);color:var(--warn)}.b-no{background:var(--bad-tint);color:var(--bad)}.b-cam{background:#E0E7FF;color:#4338CA}.b-done{background:#F3E8FF;color:#7E22CE}
  .empty{text-align:center;color:var(--muted);padding:26px 10px}
  .msg{border-radius:12px;padding:11px 14px;font-weight:700;margin-bottom:12px}
  .msg.err{background:var(--warn-tint);color:#92400E}.msg.ok{background:var(--ok-tint);color:#166534}.msg.info{background:#EFF6FF;color:#1E40AF}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line-2)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .switch{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
  .switch input{width:20px;height:20px;accent-color:var(--coral)}
  .loading{text-align:center;color:var(--muted);padding:40px}
  .foot{text-align:center;color:var(--faint);font-size:.8em;margin-top:24px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--bg);border-radius:12px;padding:10px 12px}.kpi span{color:var(--muted);font-size:.8em;font-weight:700}.kpi b{display:block;font-size:1.3em}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}td,th{padding-left:4px;padding-right:4px}}
  .pill .cnt,.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:.78em;margin-left:4px;text-align:center}
  .clock{margin:2px 0 12px!important;opacity:.9;font-weight:600}
  .leads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .lead{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
  .lead-tag{font-size:.78em;font-weight:800;opacity:.9}.lead-name{font-size:1.25em;font-weight:900}.lead-v{font-size:.85em;opacity:.95}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .stat{position:relative;background:var(--surface);border-radius:var(--r-md);padding:12px 14px 12px 18px;box-shadow:var(--shadow);overflow:hidden}
  .stat i{position:absolute;left:0;top:0;bottom:0;width:6px}.stat span{color:var(--muted);font-size:.8em;font-weight:700}.stat b{display:block;font-size:1.4em}
  .form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 6px}
  .form4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 2fr auto;gap:10px;align-items:end}
  .form3 label,.form4 label{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted);font-weight:700}
  .form3 select,.form4 input{width:100%}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.card-head h2{margin:0}
  .bars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .bar-row{display:grid;grid-template-columns:26px minmax(80px,140px) 1fr 76px;gap:8px;align-items:center}
  .bar-rank{color:var(--muted);font-weight:800;text-align:right}.bar-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-name small{color:var(--faint);font-weight:600;margin-left:4px;font-size:.75em}
  .bar-track{height:16px;background:var(--bg);border-radius:999px;overflow:hidden}.bar-track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F2392F,#FFD21F 40%,#2FC653 70%,#4C88FF)}
  .bar-v{text-align:right;font-weight:800}.bar-v small{display:block;font-size:.72em;color:var(--muted);font-weight:700}
  .btn.sm{padding:6px 10px;font-size:.82em;border-radius:9px}
  code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.9em}
  @media (max-width:640px){.leads,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.leads .lead:first-child{grid-column:1/-1}.form4{grid-template-columns:repeat(3,minmax(0,1fr))}.form4 label:nth-child(4){grid-column:1/-1}.form4 .btn{grid-column:1/-1}.bar-row{grid-template-columns:22px 80px 1fr 64px}.bar-name small{display:none}}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="brand" href="#" id="brand"><span class="logo"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></span><span id="brandName">색깔 매트 놀이터</span></a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="view"><div class="loading">불러오는 중…</div></div>
  <p class="foot">Made by <b>음악적체육인</b> · <span id="ver"></span></p>
</div>

<script src="cm-app.js"></script>
<script>
(function(){
'use strict';
const VERSION = 'app v1.1';
const REQUIRED_SHELL = 1;
const GAME_NAME = { stroop:'색깔 스트룹', basic:'색깔 점프', memory:'기억력 스텝', rhythm:'리듬 스텝', dir:'방향 점프', quiz:'퀴즈 점프', assoc:'연상 점프', twist:'손발 트위스터', freeze:'얼음 스텝', lava:'용암 매트' };
const DIFF = { normal:'노말', hard:'하드', expert:'익스퍼트' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString('ko-KR');
const dur = s => { s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? h+'시간 '+m+'분' : m ? m+'분'+(s%60? ' '+s%60+'초':'') : s+'초'; };
const q = Object.fromEntries(new URLSearchParams(location.search));
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
$('ver').textContent = VERSION;

// page: main(첫 화면) · admin(관리자 메뉴) · approval(기록 승인 = 관리자 메뉴의 승인 탭)
const APP = { s: q.s || '', pub: null, page: q.page === 'admin' || q.page === 'approval' ? 'admin' : 'main', token: null, data: null,
  tab: q.page === 'approval' ? 'pending' : (q.tab || 'pending') };
try { const t = JSON.parse(sessionStorage.getItem('cm_token|' + APP.s) || 'null'); if (t && t.exp > Date.now()) APP.token = t.token; } catch (e) {}

function rpc(fn, args){
  return fetch(APP.s, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), redirect:'follow' })
    .then(r => { if (!r.ok) throw new Error('학교 시트 응답 오류 (' + r.status + ')'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || '요청 실패'); return j.result; });
}
function selfUrl(page){ return location.href.split('?')[0] + '?s=' + encodeURIComponent(APP.s) + (page ? '&page=' + page : ''); }
function go(page, tab){ APP.page = page; if (tab) APP.tab = tab; history.replaceState(null, '', selfUrl(page === 'admin' ? (APP.tab === 'pending' ? 'approval' : 'admin') : '')); render(); window.scrollTo(0, 0); }
function wireInstall(){ const b = $('cmInstallBtn'); if (b) b.onclick = () => CMApp.showInstall(); }
function showStudentQr(){
  CMApp.showQrList([
    { key:'stu', label:'🙋 우리 학교 화면', url: selfUrl(), note:'학생 휴대폰·태블릿으로 찍으면 우리 학교 매트 놀이터가 열려요. 이름을 고르고 카메라 판정으로 뛰어요.' },
    { key:'board', label:'🏆 전국 현황판', url: CMApp.ROOT + 'board.html', note:'찍으면 전국 매트 현황판이 열려요.' }
  ]);
}
function setNav(){
  if (!APP.s) { $('nav').innerHTML = '<button class="pill" id="cmInstallBtn">📲 바로가기</button>'; wireInstall(); return; }
  const pend = APP.pub && APP.pub.pending ? '<span class="cnt">' + APP.pub.pending + '</span>' : '';
  $('nav').innerHTML = (APP.page === 'main'
      ? '<a class="pill" href="board.html" target="_blank">🏆 전국 현황판</a>' +
        '<button class="pill" id="qrBtn">📱 접속 QR</button>' +
        '<button class="pill" id="apBtn">기록 승인' + pend + '</button>' +
        '<button class="pill" id="adBtn">관리자 메뉴</button>'
      : '<button class="pill" id="mainBtn">← 메인으로</button><button class="pill" id="qrBtn">📱 접속 QR</button>') +
    '<button class="pill" id="cmInstallBtn">📲 바로가기</button>';
  if ($('qrBtn')) $('qrBtn').onclick = showStudentQr;
  if ($('apBtn')) $('apBtn').onclick = () => go('admin', 'pending');
  if ($('adBtn')) $('adBtn').onclick = () => go('admin', 'students');
  if ($('mainBtn')) $('mainBtn').onclick = () => { reloadPublic().then(() => go('main')); };
  wireInstall();
}
function reloadPublic(){ return rpc('getPublic').then(p => { APP.pub = p; if (p.title) $('brandName').textContent = p.title; }).catch(() => {}); }

function climbCard(c){
  if (!c || !window.CMApp || !CMApp.climbHTML) return '';
  const ys = c.years || {};
  return CMApp.climbHTML(Number(ys[c.year]) || 0, '🚀 우리 학교 하늘까지 · ' + c.year + '학년도', Number(ys[String(Number(c.year) - 1)]) || 0);
}
const clsKey = s => (s.grade ? s.grade + '학년 ' : '') + (s.cls ? s.cls + '반' : '');

/* ================= 메인 (첫 화면) ================= */
const STU = { grade: '', cls: '', sid: q.sid || '', rule: 'ink', mode: '1', speed: '1', period: LS.get('cm_period', 'month') };
(function(){ const last = LS.get('cm_pick|' + APP.s, null); if (last) { STU.grade = last.grade; STU.cls = last.cls; } })();
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function weekStart(todayStr){ const d = new Date(todayStr + 'T00:00:00'); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); }   // 월요일
function leaders(){
  const p = APP.pub, byId = {}; p.students.forEach(s => byId[s.id] = s);
  const today = p.now, ws = weekStart(today), mon = today.slice(0, 7);
  const sum = (from, to) => { const m = {}; (p.days || []).forEach(d => { if (d[1] >= from && d[1] <= to && byId[d[0]]) m[d[0]] = (m[d[0]] || 0) + d[2]; }); return m; };
  const top = m => { let id = null; Object.keys(m).forEach(k => { if (!id || m[k] > m[id]) id = k; }); return id ? { s: byId[id], v: m[id] } : null; };
  const acc = {}; (p.days || []).forEach(d => { if (d[1].slice(0,7) === mon && d[5] && byId[d[0]]) { const a = acc[d[0]] || (acc[d[0]] = [0,0]); a[0] += d[6]; a[1] += d[7]; } });
  let accTop = null; Object.keys(acc).forEach(k => { const v = acc[k][1] ? acc[k][0] / acc[k][1] * 100 : 0; if (!accTop || v > accTop.v) accTop = { s: byId[k], v }; });
  return { today: top(sum(today, today)), week: top(sum(ws, today)), acc: accTop };
}
function renderMain(){
  const p = APP.pub, list = p.students || [];
  const L = leaders();
  const lead = (tag, x, unit, cls) => '<div class="lead ' + (cls||'') + '"><span class="lead-tag">' + tag + '</span><span class="lead-name">' + (x ? esc(x.s.name) : '아직 없어요') + '</span><span class="lead-v mono">' + (x ? unit(x.v) : '') + '</span></div>';
  const today = p.now, ws = weekStart(today), mon = today.slice(0, 7);
  const days = p.days || [];
  const yearM = (p.climb && p.climb.years && p.climb.years[p.climb.year]) || 0;
  const monRuns = days.filter(d => d[1].slice(0,7) === mon).reduce((a, d) => a + d[5], 0);
  let h = '<div class="hero"><h1>' + esc(p.title || '색깔 매트 놀이터') + '</h1><p class="clock" id="clock"></p>' +
    '<div class="leads">' + lead('오늘의 매트왕', L.today, v => num(v) + '번 정답') + lead('이번 주 매트왕', L.week, v => num(v) + '번 정답', 'l2') +
      lead('이번 달 정확도왕', L.acc, v => (Math.round(v * 10) / 10) + '%', 'l3') + '</div></div>';
  h += climbCard(p.climb);
  h += '<div class="stats">' +
    '<div class="stat"><i style="background:var(--red)"></i><span>등록 학생</span><b class="mono">' + list.length + '명</b></div>' +
    '<div class="stat"><i style="background:var(--yellow)"></i><span>이번 학년도 정답 착지</span><b class="mono">' + num(yearM) + '</b></div>' +
    '<div class="stat"><i style="background:var(--green)"></i><span>오늘 뛴 판</span><b class="mono">' + (p.today || []).length + '판</b></div>' +
    '<div class="stat"><i style="background:var(--blue)"></i><span>이번 달 완주</span><b class="mono">' + monRuns + '판</b></div></div>';

  // 카메라로 뛰기
  const grades = [...new Set(list.map(s => String(s.grade || '')))];
  if (!grades.includes(STU.grade)) STU.grade = grades[0] || '';
  const clsList = [...new Set(list.filter(s => String(s.grade || '') === STU.grade).map(s => String(s.cls || '')))];
  if (!clsList.includes(STU.cls)) STU.cls = clsList[0] || '';
  const names = list.filter(s => String(s.grade || '') === STU.grade && String(s.cls || '') === STU.cls);
  if (STU.sid && !list.some(s => s.id === STU.sid)) STU.sid = '';
  h += '<div class="card"><h2>📷 카메라 판정으로 뛰기</h2>' +
    (!list.length ? '<div class="empty">아직 학생이 등록되지 않았어요.<br>위쪽 <b>관리자 메뉴 → 학생 관리</b>에서 등록해 주세요.</div>' :

/* ================= 전국 현황판 보내기 =================
   학교 밖으로 나가는 것: 가린 이름(김*늘)·학년·날짜별 게임·난이도·정답/시도·플레이 시간·완주 (반·번호·실명은 안 나감)
   카메라 판정 + 승인된 기록만, 이번 달과 지난 달 */
const NAT = {
  collector: '',
  load(){ return this.collector ? Promise.resolve() : fetch('national.json', { cache:'no-store' }).then(r => r.json()).then(j => { this.collector = j.collector || ''; }).catch(() => {}); },
  cfg(){ return (APP.data && APP.data.extra && APP.data.extra.nat) || {}; },
  sha(t){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(b => Array.from(new Uint8Array(b)).map(x => (x<16?'0':'') + x.toString(16)).join('')); },
  mask(n){ const c = Array.from(String(n||'').trim()); if (c.length<=1) return c.join(''); if (c.length===2) return c[0]+'*'; return c[0]+'*'.repeat(c.length-2)+c[c.length-1]; },
  newKey(){ try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => (b<16?'0':'')+b.toString(16)).join(''); },
  deployId(u){ const m = String(u).match(/\/s\/([A-Za-z0-9_-]{20,})\//); return m ? m[1] : String(u); },
  moved(){ const c = this.cfg(); return !!(c.on && c.shell && c.shell !== this.deployId(APP.s)); },
  post(fn, payload){
    return fetch(this.collector, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args:[payload] }), redirect:'follow' })
      .then(r => { if (!r.ok) throw new Error('현황판 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error || '현황판 요청 실패'); return j.result; });
  },
  sync(){
    const c = this.cfg();
    if (!c.on || !c.key || !APP.data.approvalOn || this.moved()) return Promise.resolve(null);
    return this.load().then(() => {
      if (!this.collector) return null;
      const now = new Date(), pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const from = pm.getFullYear() + '-' + String(pm.getMonth()+1).padStart(2,'0') + '-01';
      const byId = {}; APP.data.students.forEach(s => byId[s.id] = s);
      const agg = {}, dates = {};
      APP.data.records.forEach(r => {
        if (!r.date || r.date < from) return;
        dates[r.date] = 1;                                    // 승인을 취소한 날도 다시 보내서 덮어쓰게
        if (r.status !== 'approved' || !r.camera || !byId[r.studentId]) return;
        const k = [r.date, r.studentId, r.game, r.difficulty].join('|');
        const a = agg[k] || (agg[k] = { date:r.date, id:r.studentId, game:r.game, diff:r.difficulty, c:0, a:0, s:0, runs:0, dc:0, da:0 });
        a.c += r.correct; a.a += r.attempts; a.s += r.sec;
        if (r.completed) { a.runs++; a.dc += r.correct; a.da += r.attempts; }
      });
      const keys = {};
      return Promise.all(Object.keys(byId).map(id => this.sha('cm-student|' + c.key + '|' + id).then(h => keys[id] = h.slice(0,10)))).then(() => {
        const days = {};
        Object.keys(dates).forEach(d => days[d] = []);
        Object.values(agg).forEach(a => { const s = byId[a.id]; days[a.date].push([keys[a.id], this.mask(s.name), String(s.grade||''), a.game, a.diff, a.c, a.a, a.s, a.runs, a.dc, a.da]); });
        const list = Object.keys(days).sort().map(d => ({ date:d, rows:days[d] }));
        return this.post('matReport', { key:c.key, name: c.showName ? (c.name||'') : '', showName: !!c.showName, schoolName: c.name || '', days: list })
          .then(res => { LS.set('cm_nat_last|' + APP.s, Date.now()); return res; });
      });
    });
  }
};

function parseStudents(text){
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(/[\t,]+|\s+/).filter(Boolean))
    .map(c => c.length >= 4 ? [c[0], c[1], c[2], c.slice(3).join(' ')] : null)
    .filter(c => c && !/이름|성명/.test(c[3]))
    .map(c => [c[0].replace(/학년$/,''), c[1].replace(/반$/,''), c[2].replace(/번$/,''), c[3]])
    .filter(c => /^\d{0,2}$/.test(c[0]) && c[3]);
}

      (pending.length ? '<div class="row"><button class="btn green" id="okSel">✓ 고른 기록 승인</button><button class="btn ghost" id="okAll">모두 승인 (' + pending.length + ')</button><button class="btn ghost" id="noSel" style="color:var(--bad)">✕ 고른 기록 반려</button></div>' : '') +
      recTable(pending) + '</div>';
  } else if (APP.tab === 'students') {
    h += '<div class="card"><h2>한 명씩 추가</h2><form class="form4" id="addOne">' +
      '<label>학년<input type="text" id="aG" inputmode="numeric" placeholder="4"></label><label>반<input type="text" id="aC" inputmode="numeric" placeholder="1"></label>' +
      '<label>번호<input type="text" id="aN" inputmode="numeric" placeholder="3"></label><label>이름<input type="text" id="aName" placeholder="김하늘"></label>' +
      '<button class="btn">추가</button></form></div>' +
      '<div class="card"><h2>여러 명 한 번에</h2><p class="hint">엑셀·구글시트에서 <b>학년 · 반 · 번호 · 이름</b>을 복사해 붙여넣거나, <b>띄어쓰기</b>로 한 줄에 한 명씩 써도 돼요 (예: <code>4 1 3 김하늘</code>, <code>4학년 1반 3번 김하늘</code>). 제목 줄은 건너뛰고, 이미 있는 학생은 빠져요.</p>' +
      '<textarea id="bulk" rows="6" placeholder="4 1 1 김하늘&#10;4 1 2 이준"></textarea><div class="row"><span class="hint" id="bulkInfo" style="margin:0">0명 인식</span><button class="btn" id="bulkGo" style="margin-left:auto">등록</button></div><div id="bulkPrev"></div></div>' +
      '<div class="card"><div class="card-head"><h2>등록된 학생 (' + d.students.length + '명)</h2>' + (d.students.length ? '<button class="btn ghost" id="stuDel" style="color:var(--bad)">고른 학생 지우기</button>' : '') + '</div>' +
      (d.students.length ? '<p class="hint">학생을 지우면 그 학생의 기록도 함께 지워져요.</p><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="pickAll"></th><th>학년</th><th>반</th><th>번호</th><th>이름</th><th></th></tr></thead><tbody>' +
        d.students.map(s => '<tr data-sid="' + esc(s.id) + '"><td><input type="checkbox" class="pick" value="' + esc(s.id) + '"></td><td>' + esc(s.grade) + '</td><td>' + esc(s.cls) + '</td><td>' + esc(s.number) + '</td><td><b>' + esc(s.name) + '</b></td><td><button class="btn ghost sm" data-edit="' + esc(s.id) + '">수정</button></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">아직 학생이 없어요.</div>') + '</div>';
  } else if (APP.tab === 'records') {
    const all = d.records.slice().sort((a,b) => b.ts - a.ts);
    const f = APP.recFilter || '';
    const shown = (f ? all.filter(r => r.studentId === f) : all).slice(0, 300);
    h += '<div class="card"><div class="card-head"><h2>기록 관리</h2><select id="recF"><option value="">모든 학생</option>' + d.students.map(s => '<option value="' + esc(s.id) + '"' + (s.id===f?' selected':'') + '>' + esc(clsKey(s) + ' ' + s.name) + '</option>').join('') + '</select></div>' +
      '<p class="hint">최근 300개까지 보여요. 고른 기록을 승인·대기로 바꾸거나 지울 수 있어요.</p>' +
      '<div class="row"><button class="btn ghost" id="recOk">승인으로</button><button class="btn ghost" id="recWait">대기로</button><button class="btn ghost" id="recDel" style="color:var(--bad)">지우기</button></div>' +
      recTable(shown) + '</div>';
  } else {
    const last = LS.get('cm_nat_last|' + APP.s, 0);
    h += '<div class="card"><h2>🏆 전국 현황판 참여</h2>' +
      '<p class="hint">켜면 <b>승인한 카메라 판정 기록</b>을 전국 현황판으로 보내요. 보내는 것: 가린 이름(김*늘)·학년·게임·난이도·정답/시도·플레이 시간·완주. <b>반·번호·실명은 보내지 않아요.</b></p>' +
      (!d.approvalOn ? '<div class="msg err">전국 현황판은 승인 절차가 켜져 있어야 참여할 수 있어요.</div>' : '') +
      (NAT.moved() ? '<div class="msg err">다른 시트에서 복사했거나 새로 배포한 것 같아요. 아래 "참여 번호 새로 만들기"를 누르면 이 시트로 다시 참여해요.</div>' : '') +
      '<div class="row"><label>학교 이름</label><input type="text" id="natName" value="' + esc(nat.name || '') + '" placeholder="예: 햇살초등학교 4학년" style="flex:1;min-width:200px"></div>' +
      '<label class="switch"><input type="checkbox" id="natShow" ' + (nat.showName ? 'checked' : '') + '> 현황판에 학교 이름 보이기 <span class="hint" style="margin:0">(끄면 "익명 학교"로 보여요)</span></label>' +
      '<div class="row" style="margin-top:10px">' + (nat.on ? '<button class="btn" id="natSave">저장하고 지금 보내기</button><button class="btn ghost" id="natOff">참여 끄기</button>' + (NAT.moved() ? '<button class="btn ghost" id="natNew">참여 번호 새로 만들기</button>' : '') : '<button class="btn" id="natOn" ' + (d.approvalOn ? '' : 'disabled') + '>참여하기</button>') +
      '<a class="btn ghost" href="board.html" target="_blank">현황판 보기</a></div>' +
      (nat.on ? '<p class="hint">참여 중' + (last ? ' · 마지막으로 보낸 때 ' + new Date(last).toLocaleString('ko-KR') : '') + ' · 기록을 승인하면 자동으로 보내요.</p>' : '') + '</div>' +
      '<div class="card"><h2>승인 절차</h2><label class="switch"><input type="checkbox" id="apOn" ' + (d.approvalOn ? 'checked' : '') + '> 학생 기록은 선생님이 승인해야 인정돼요</label><p class="hint">끄면 카메라 판정 기록은 바로 인정되지만, 전국 현황판에는 참여할 수 없어요.</p></div>' +
      '<div class="card"><h2>학생 접속</h2><p class="hint">학생 휴대폰·태블릿으로 QR을 찍으면 우리 학교 메인 화면이 열려요. 한 번 들어온 기기는 다음부터 자동으로 이 학교로 들어와요.</p><div class="row"><button class="btn" id="stuQr">📱 학생 접속 QR</button><button class="btn ghost" id="copyUrl">주소 복사</button></div></div>' +
      '<div class="card"><h2>관리자 비밀번호</h2><form class="row" id="pwf"><input type="password" id="np1" placeholder="새 비밀번호 (4자 이상)"><input type="password" id="np2" placeholder="한 번 더"><button class="btn ghost">바꾸기</button></form></div>' +
      '<div class="card"><h2>껍데기 · 연결</h2><p class="hint">이 기기는 다음부터 주소 없이 <b>app.html</b>만 열어도 이 학교 시트로 바로 들어와요. 다른 시트로 바꾸려면 <a href="app.html?new=1">새로 연결하기</a>.</p><p class="hint">지금 껍데기 판 ' + d.shell + ' · 화면 ' + VERSION + '. 화면은 자동으로 새 판이 되고, 껍데기를 바꿔야 할 때만 여기서 알려 드려요.</p><button class="btn ghost" id="logout">로그아웃</button></div>';
  }
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { APP.tab = b.dataset.tab; history.replaceState(null, '', selfUrl(APP.tab === 'pending' ? 'approval' : 'admin')); renderAdmin(); });
  wirePickAll();
  const act = (p, note) => { $('view').querySelectorAll('button').forEach(b => b.disabled = true); return p.then(() => rpc('getAllDataAdmin', [APP.token])).then(dd => { APP.data = dd; return syncAfter(note); }).then(m => renderAdmin(m)).catch(e => { alert(e.message); loadAdmin(); }); };
  const need = ids => { if (!ids.length) { alert('먼저 골라 주세요.'); return false; } return true; };
  if (APP.tab === 'pending' && pending.length) {
    $('okSel').onclick = () => { const ids = picked(); if (need(ids)) act(rpc('setRecordsStatus', [APP.token, ids, 'approved']), ids.length + '개를 승인했어요'); };
    $('okAll').onclick = () => { if (confirm(pending.length + '개를 모두 승인할까요?')) act(rpc('setRecordsStatus', [APP.token, pending.map(r => r.id), 'approved']), pending.length + '개를 승인했어요'); };
    $('noSel').onclick = () => { const ids = picked(); if (need(ids)) act(rpc('setRecordsStatus', [APP.token, ids, 'rejected']), ids.length + '개를 반려했어요'); };
  }
  if (APP.tab === 'records') {
    $('recF').onchange = e => { APP.recFilter = e.target.value; renderAdmin(); };
    $('recOk').onclick = () => { const ids = picked(); if (need(ids)) act(rpc('setRecordsStatus', [APP.token, ids, 'approved']), '승인으로 바꿨어요'); };
    $('recWait').onclick = () => { const ids = picked(); if (need(ids)) act(rpc('setRecordsStatus', [APP.token, ids, 'pending']), '대기로 바꿨어요'); };
    $('recDel').onclick = () => { const ids = picked(); if (need(ids) && confirm(ids.length + '개 기록을 지울까요? 되돌릴 수 없어요.')) act(rpc('deleteRecords', [APP.token, ids]), ids.length + '개를 지웠어요'); };
  }
  if (APP.tab === 'students') {
    $('addOne').onsubmit = e => {
      e.preventDefault();
      const row = [$('aG').value.trim(), $('aC').value.trim(), $('aN').value.trim(), $('aName').value.trim()];
      if (!row[3]) return alert('이름을 넣어 주세요.');
      const keep = { g: row[0], c: row[1], n: row[2] };
      rpc('addStudentsBulk', [APP.token, [row]]).then(r => rpc('getAllDataAdmin', [APP.token]).then(dd => { APP.data = dd;
        renderAdmin(r.added ? row[3] + ' 학생을 추가했어요' : '이미 있는 학생이에요');
        // 다음 학생을 바로 넣을 수 있게 학년·반은 그대로, 번호는 하나 올려 둠
        $('aG').value = keep.g; $('aC').value = keep.c; $('aN').value = /^\d+$/.test(keep.n) ? String(+keep.n + 1) : ''; $('aName').focus(); })).catch(e => alert(e.message));
    };
    const showPrev = () => { const rows = parseStudents($('bulk').value); $('bulkInfo').textContent = rows.length + '명 인식';
      $('bulkPrev').innerHTML = rows.length ? '<div class="table-wrap" style="max-height:200px;overflow:auto"><table><thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th></tr></thead><tbody>' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td><b>' + esc(r[3]) + '</b></td></tr>').join('') + '</tbody></table></div>' : ''; };
    $('bulk').oninput = showPrev;
    $('bulkGo').onclick = () => { const rows = parseStudents($('bulk').value); if (!rows.length) return alert('학년·반·번호·이름 네 칸을 넣어 주세요.'); let added = 0; act(rpc('addStudentsBulk', [APP.token, rows]).then(r => { added = r.added; }), rows.length + '명 중 새 학생을 등록했어요'); };
    if ($('stuDel')) $('stuDel').onclick = () => { const ids = picked(); if (need(ids) && confirm(ids.length + '명과 그 기록을 지울까요?')) act(rpc('deleteStudents', [APP.token, ids]), ids.length + '명을 지웠어요'); };
    $('view').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const s = stuOf(b.dataset.edit), tr = b.closest('tr');
      tr.innerHTML = '<td></td><td><input type="text" class="ed" value="' + esc(s.grade) + '" size="2"></td><td><input type="text" class="ed" value="' + esc(s.cls) + '" size="2"></td><td><input type="text" class="ed" value="' + esc(s.number) + '" size="2"></td><td><input type="text" class="ed" value="' + esc(s.name) + '" size="8"></td><td><button class="btn sm" data-save>저장</button></td>';
      tr.querySelector('[data-save]').onclick = () => { const v = [...tr.querySelectorAll('.ed')].map(x => x.value.trim()); if (!v[3]) return alert('이름을 넣어 주세요.');
        act(rpc('updateStudent', [APP.token, s.id, { grade:v[0], cls:v[1], number:v[2], name:v[3] }]), v[3] + ' 학생 정보를 고쳤어요'); };
    });
  }
  if (APP.tab === 'settings') {
    const natPatch = o => rpc('setExtraSettings', [APP.token, { nat: Object.assign({}, NAT.cfg(), o) }]);
    const name = () => $('natName').value.trim();
    if ($('natOn')) $('natOn').onclick = () => { if (!name()) return alert('학교 이름을 넣어 주세요.'); act(natPatch({ on:true, key: NAT.cfg().key || NAT.newKey(), name: name(), showName: $('natShow').checked, shell: NAT.deployId(APP.s) }), '전국 현황판에 참여했어요'); };
    if ($('natSave')) $('natSave').onclick = () => { if (!name()) return alert('학교 이름을 넣어 주세요.'); act(natPatch({ name: name(), showName: $('natShow').checked }), '저장했어요'); };
    if ($('natNew')) $('natNew').onclick = () => { if (confirm('이 시트로 새 참여 번호를 만들까요? 예전 번호의 기록은 현황판에 그대로 남아요.')) act(natPatch({ key: NAT.newKey(), shell: NAT.deployId(APP.s) }), '새 참여 번호로 참여했어요'); };
    if ($('natOff')) $('natOff').onclick = () => {
      if (!confirm('참여를 끄면 현황판에서 우리 학교 매트 기록이 지워져요. 끌까요?')) return;
      const c = NAT.cfg();
      act(NAT.load().then(() => NAT.collector && c.key ? NAT.post('leave', { key: c.key }).catch(() => null) : null).then(() => natPatch({ on:false })), '참여를 껐어요');
    };
    $('apOn').onchange = e => {
      const on = e.target.checked;
      if (!on && NAT.cfg().on && !confirm('승인 절차를 끄면 전국 현황판 참여도 꺼져요. 끌까요?')) { e.target.checked = true; return; }
      act(rpc('setAppSettings', [APP.token, { approvalOn: on }]).then(() => (!on && NAT.cfg().on) ? natPatch({ on:false }) : null), on ? '승인 절차를 켰어요' : '승인 절차를 껐어요');
    };
    $('stuQr').onclick = showStudentQr;
    $('copyUrl').onclick = function(){ navigator.clipboard.writeText(selfUrl()).then(() => this.textContent = '복사했어요 ✓'); };
    $('pwf').onsubmit = e => { e.preventDefault(); const a = $('np1').value, b = $('np2').value; if (a !== b) return alert('두 번 넣은 비밀번호가 달라요.'); rpc('changeAdminPassword', [APP.token, a]).then(r => { if (!r.ok) return alert(r.message); APP.isDefaultPw = false; renderAdmin('비밀번호를 바꿨어요'); }).catch(e => alert(e.message)); };
    $('logout').onclick = () => { APP.token = null; try { sessionStorage.removeItem('cm_token|' + APP.s); } catch (e) {} go('main'); };
  }
}

/* ================= 시작 ================= */
function render(){
  setNav();
  if (!APP.s) return renderSetup();
  if (APP.page === 'admin') { $('view').innerHTML = '<div class="loading">불러오는 중…</div>'; return loadAdmin(); }   // 들어올 때마다 새 자료
  return renderMain();
}
$('brand').onclick = e => { e.preventDefault(); if (APP.s) reloadPublic().then(() => go('main')); };
// 주소에 학교 시트가 없으면: 이 기기에서 연결했던 학교 시트로 바로 이어서 열기 (?new=1 이면 새로 연결 화면)
if (!APP.s && !q.new) {
  const last = LS.get('cm_last_shell', '');
  if (last) { location.replace(location.pathname + '?s=' + encodeURIComponent(last) + (q.page ? '&page=' + encodeURIComponent(q.page) : '')); }
}
if (!APP.s) { render(); }
else {
  LS.set('cm_last_shell', APP.s);
  setNav();
  rpc('getPublic').then(p => {
    APP.pub = p;
    if (p.title) { $('brandName').textContent = p.title; document.title = p.title + ' — 매트 놀이터'; }
    if (!p.days) { p.days = []; p.today = []; p.now = new Date().toISOString().slice(0,10); }
    render();
  }).catch(e => {
    $('view').innerHTML = '<div class="card"><div class="msg err">학교 시트에 연결하지 못했어요: ' + esc(e.message) + '</div><p class="hint">껍데기 배포 주소가 맞는지, 배포의 액세스 권한이 "모든 사용자"인지 확인해 주세요.</p><a class="btn ghost" href="app.html?new=1">다른 주소로 새로 연결하기</a></div>';
  });
}
})();
</script>
</body>
</html>
